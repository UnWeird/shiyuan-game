<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>棋子 / 信息层方案 · 十元棋</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A227;--goldL:#E8C84A;--parch:#F5E6C8}
  *{box-sizing:border-box}
  body{margin:0;padding:26px;background:#07090c;color:var(--parch);
       font-family:"Noto Serif SC",serif}
  h1{font-size:26px;color:var(--goldL);margin:0 0 3px;letter-spacing:.1em;font-weight:600}
  .sub{color:rgba(245,230,200,.35);font-size:12px;letter-spacing:.18em;margin-bottom:22px}
  h2.sec{font-size:14px;color:#7FD4C1;letter-spacing:.22em;margin:34px 0 12px;font-weight:600;
         border-bottom:1px solid rgba(127,212,193,.22);padding-bottom:7px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:1280px}
  .card{background:#11151b;border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:13px 13px 10px}
  .card h3{font-size:14px;margin:0 0 2px;color:var(--goldL);letter-spacing:.06em;font-weight:600}
  .card .tag{font-size:10px;color:rgba(245,230,200,.32);letter-spacing:.13em;margin-bottom:9px}
  .card .note{font-size:11px;line-height:1.7;color:rgba(245,230,200,.5);margin-top:9px;
              border-top:1px solid rgba(255,255,255,.07);padding-top:8px}
  .card.rec{border-color:rgba(127,212,193,.5);box-shadow:0 0 22px rgba(127,212,193,.1)}
  .card.rec h3::after{content:" ← 推荐";font-size:10px;color:#7FD4C1;letter-spacing:.08em}
  .card.bad{border-color:rgba(214,96,77,.4)} .card.bad h3{color:#E08476}
  b{color:#F0D98A;font-weight:600}
  i{color:#7FD4C1;font-style:normal}
  svg{display:block;width:100%;height:auto;border-radius:5px;background:#1A1F27}
</style></head><body>
<h1>棋子与信息层</h1>
<div class="sub">同一枚棋子能承载多少规则</div>
<div id="out"></div>

<script>
/* ============ 调色：世界色 / 信息色 严格分开 ============ */
const C = {
  p1:'#C0392B', p1d:'#7E1C15', p2:'#2FA07A', p2d:'#1B5E47',
  parch:'#F3E6CA', ink:'#0E1116',
  tile:'#39414C', tileHi:'#454E5B', seam:'rgba(255,255,255,.07)',
  /* 信息层：固定语义，绝不复用 */
  move:'#5BC8E8',   // 青 = 我方可移动
  face:'#F0B44A',   // 琥珀 = 朝向 / 射界
  threat:'#E2564B', // 朱 = 威胁 / 致命
  pick:'#FFFFFF',   // 白 = 当前选中
};
const TAU = Math.PI*2;
const pol = (cx,cy,r,deg)=>[cx+r*Math.cos(deg*Math.PI/180), cy+r*Math.sin(deg*Math.PI/180)];
/** 环形弧段（用于体力刻度） */
function arc(cx,cy,r,a0,a1,w,color,op=1){
  const [x0,y0]=pol(cx,cy,r,a0), [x1,y1]=pol(cx,cy,r,a1);
  const big = (a1-a0)>180 ? 1 : 0;
  return `<path d="M ${x0.toFixed(1)},${y0.toFixed(1)} A ${r},${r} 0 ${big} 1 ${x1.toFixed(1)},${y1.toFixed(1)}"
    fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
}

/* ============ 棋子绘制 ============ */
/** 兵种剪影（P2 备选用） */
const SIL = {
  bu:  rr=>`<path d="M0,${-rr*.62} L${rr*.44},${-rr*.4} L${rr*.44},${rr*.14}
              Q${rr*.44},${rr*.56} 0,${rr*.72} Q${-rr*.44},${rr*.56} ${-rr*.44},${rr*.14}
              L${-rr*.44},${-rr*.4} Z" fill="${C.parch}"/>`,
  qi:  rr=>`<path d="M${-rr*.42},${rr*.62} A ${rr*.52} ${rr*.52} 0 1 1 ${rr*.42},${rr*.62}
              L${rr*.2},${rr*.62} A ${rr*.3} ${rr*.3} 0 1 0 ${-rr*.2},${rr*.62} Z"
              fill="${C.parch}"/>`,
  gong:rr=>`<path d="M${-rr*.1},${-rr*.66} Q${rr*.6},0 ${-rr*.1},${rr*.66}" fill="none"
              stroke="${C.parch}" stroke-width="${rr*.17}" stroke-linecap="round"/>
            <line x1="${-rr*.1}" y1="${-rr*.66}" x2="${-rr*.1}" y2="${rr*.66}" stroke="${C.parch}"
              stroke-width="${rr*.09}"/>`,
};
/**
 * token(o)
 *  variant: 'old' | 'seal' | 'info' | 'solid'
 *  kind: 'bu'|'qi'|'gong'  ch: 汉字  side:'p1'|'p2'
 *  hp / maxHp / move / facing(deg|null) / spent(bool) / charge(0..2)
 */
function token(o){
  const { x, y, rr=26, variant='info', kind='bu', ch='步', side='p1',
          hp=2, maxHp=2, move=1, facing=null, spent=false, charge=0, glyph='han' } = o;
  const fill = side==='p1'? C.p1 : C.p2, deep = side==='p1'? C.p1d : C.p2d;
  const uid = `t${Math.random().toString(36).slice(2,8)}`;
  let g = '';

  /* --- 现状：径向高光 + 粗刻边 + 单向投影 --- */
  if(variant==='old'){
    return `<defs><radialGradient id="${uid}" cx="35%" cy="28%" r="78%">
        <stop offset="0%" stop-color="${side==='p1'?'#D9533F':'#3FBF92'}"/>
        <stop offset="100%" stop-color="${side==='p1'?'#8B1A1A':'#2E6B4F'}"/></radialGradient></defs>
      <g transform="translate(${x},${y})" style="filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))">
        <circle r="${rr}" fill="url(#${uid})" stroke="${side==='p1'?'#4A0E0E':'#163A2A'}" stroke-width="${rr*.12}"/>
        ${kind==='gong'?`<line x1="0" y1="0" x2="${rr*1.55}" y2="0" stroke="#3E2F14"
            stroke-width="${rr*.16}"/><polygon points="${rr*1.75},0 ${rr*1.42},${-rr*.26} ${rr*1.42},${rr*.26}"
            fill="#3E2F14"/>`:''}
        <text y="1" text-anchor="middle" dominant-baseline="middle" font-size="${rr*1.0}"
          fill="${C.parch}" font-weight="700">${ch}</text></g>`;
  }

  /* --- 立体：侧壁 + 顶面 --- */
  if(variant==='solid'){
    g += `<ellipse cx="0" cy="${rr*.74}" rx="${rr*1.0}" ry="${rr*.24}" fill="rgba(0,0,0,.5)"/>
          <circle cy="${rr*.34}" r="${rr}" fill="${deep}"/>
          <rect x="${-rr}" y="0" width="${rr*2}" height="${rr*.34}" fill="${deep}"/>
          <circle r="${rr}" fill="${fill}"/>
          <circle r="${rr}" fill="url(#${uid}-lit)"/>
          <circle r="${rr}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1"/>`;
    g = `<defs><radialGradient id="${uid}-lit" cx="40%" cy="26%" r="85%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".14"/></radialGradient></defs>` + g;
  } else {
    g += `<ellipse cx="0" cy="${rr*.95}" rx="${rr*.8}" ry="${rr*.17}" fill="rgba(0,0,0,.34)"/>
          <circle r="${rr}" fill="${fill}"/>`;
  }

  /* --- 朝向：与轮廓融为一体的船首尖，而不是压在棋子上的箭头 --- */
  if(facing!==null){
    g = `<g transform="rotate(${facing})">
        <path d="M ${rr*.62},${-rr*.72} L ${rr*1.42},0 L ${rr*.62},${rr*.72} Z"
              fill="${fill}"/>
        <path d="M ${rr*.78},${-rr*.5} L ${rr*1.24},0 L ${rr*.78},${rr*.5} Z"
              fill="${C.face}" opacity=".95"/></g>` + g;
  }

  /* --- 兵种：汉字 或 剪影 --- */
  g += glyph==='han'
    ? `<text y="${variant==='info'?-rr*.06:1}" text-anchor="middle" dominant-baseline="middle"
         font-size="${rr*(variant==='info'?.88:1.0)}" fill="${C.parch}" font-weight="600">${ch}</text>`
    : `<g transform="translate(0,${variant==='info'?-rr*.08:0})">${SIL[kind](rr)}</g>`;

  /* --- info / solid 专属：体力弧 + 移动刻度 + 蓄力 --- */
  if(variant==='info'||variant==='solid'){
    /* 上弧 = 体力刻度：段数 = 体力上限，熄灭 = 已失去 */
    const TOT = 104, gap = 16, span = (TOT + gap)/maxHp - gap, start = -90 - TOT/2;
    for(let i=0;i<maxHp;i++){
      const a0 = start + i*(span+gap), a1 = a0 + span;
      g += arc(0,0,rr*1.3, a0,a1, rr*.2, i<hp? C.parch : 'rgba(255,255,255,.13)');
    }
    /* 下弧 = 移动力刻度：几格就几道 */
    const MT = 20, mg = 12, mstart = 90 - ((move*MT + (move-1)*mg) - MT)/2;
    for(let i=0;i<move;i++){
      const a = mstart - i*(MT+mg);
      g += arc(0,0,rr*1.3, a-MT/2, a+MT/2, rr*.2, C.move);
    }
    for(let i=0;i<charge;i++)
      g += `<circle cx="${(-rr*.3 + i*rr*.6).toFixed(1)}" cy="${-rr*1.62}" r="${rr*.15}" fill="${C.face}"/>`;
  }

  /* --- 已行动 --- */
  if(spent) g += `<circle r="${rr}" fill="#0A0D11" opacity=".55"/>
    <line x1="${-rr*.66}" y1="${rr*.66}" x2="${rr*.66}" y2="${-rr*.66}"
          stroke="rgba(255,255,255,.5)" stroke-width="${rr*.11}" stroke-linecap="round"/>`;

  return `<g transform="translate(${x},${y})">${g}</g>`;
}
const svg = (vb,inner,h) =>
  `<svg viewBox="${vb}" ${h?`style="max-height:${h}px"`:''} xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const label = (x,y,t,c='rgba(243,230,202,.45)',s=11)=>
  `<text x="${x}" y="${y}" text-anchor="middle" font-size="${s}" fill="${c}" letter-spacing="1">${t}</text>`;

/* ============ 区块一：四种棋子 ============ */
const ROW = [ {kind:'bu',ch:'步',move:1}, {kind:'qi',ch:'骑',move:3}, {kind:'gong',ch:'弓',move:1} ];
function pieceCard(variant, glyph='han'){
  const xs=[-96,0,96], inner = ROW.map((r,i)=>token({
      x:xs[i], y:0, rr:26, variant, glyph, kind:r.kind, ch:r.ch,
      hp:2, maxHp:2, move:r.move, facing:r.kind==='gong'?0:null,
    })).join('') + xs.map((x,i)=>label(x,58,['步兵','骑兵','弓箭手'][i])).join('');
  return svg('-144 -62 288 132', inner);
}
const CARDS = [
 { cls:'bad', h3:'P1 · 现状', tag:'径向高光 + 粗刻边 + 单向投影',
   svg:pieceCard('old'),
   note:'只承载 1 个信息：兵种。塑料糖果按钮质感；弓手的<b>深色粗箭头压在棋子上面</b>，把红三角糊成一团黑。' },
 { h3:'P2 · 印章精修', tag:'哑光 + 细内圈 + 对称接地影',
   svg:pieceCard('seal'),
   note:'只修质感：去掉高光渐变与偏移投影，投影换成脚下接地椭圆。<b>信息量没变</b>——体力、行动状态、移动力仍然全靠侧边栏读。' },
 { cls:'rec', h3:'P3 · 信息令牌', tag:'每个视觉通道 = 一条规则',
   svg:pieceCard('info'),
   note:'<b>上弧＝体力刻度</b>（2 段对应体力 2，掉血熄一段，满血也可见）· <b>下横杠＝移动力</b>（骑兵 3 杠，一眼看出它能冲多远）· <b>船首尖＝朝向</b>，融进轮廓所以永不糊字 · 顶部点＝投石车蓄力层数。' },
 { h3:'P4 · 立体令牌', tag:'P3 + 侧壁，棋子"站"在盘上',
   svg:pieceCard('solid'),
   note:'和 P3 同一套信息通道，只是加了一圈深色侧壁 + 更实的接地影，读起来像实体棋子。图形/背景分离最强，代价是多一层绘制。' },
 { h3:'（可选）剪影替代汉字', tag:'P3 结构不变，只换字形层',
   svg:pieceCard('info','sil'),
   note:'盾＝步兵、马蹄＝骑兵、弓＝弓箭手。对中文玩家<b>汉字其实更快</b>，所以这不是默认；但令牌架构和字形层是解耦的，将来要做外语版只换这一层。' },
];
const OUT = document.getElementById('out');
const section = (t,cards)=>`<h2 class="sec">${t}</h2><div class="grid">` +
  cards.map(c=>`<div class="card ${c.cls||''}"><h3>${c.h3}</h3><div class="tag">${c.tag}</div>
    ${c.svg}<div class="note">${c.note}</div></div>`).join('') + `</div>`;
OUT.innerHTML = section('一 · 棋子本体', CARDS);

/* ============ 区块二：状态词汇 ============ */
(()=>{
  const S=[
    {o:{kind:'bu',ch:'步',hp:2,maxHp:2,move:1},t:'满血'},
    {o:{kind:'bu',ch:'步',hp:1,maxHp:2,move:1},t:'体力 1'},
    {o:{kind:'bu',ch:'步',hp:2,maxHp:2,move:1,spent:true},t:'已行动'},
    {o:{kind:'bu',ch:'步',hp:1,maxHp:2,move:1},t:'掉马→步'},
    {o:{kind:'gong',ch:'弓',hp:2,maxHp:2,move:1,facing:0},t:'朝东'},
    {o:{kind:'gong',ch:'弓',hp:2,maxHp:2,move:1,facing:-120},t:'朝西北'},
    {o:{kind:'gong',ch:'投',hp:2,maxHp:2,move:1,facing:0,charge:2},t:'蓄力 2'},
    {o:{kind:'bu',ch:'步',hp:2,maxHp:2,move:1,side:'p2'},t:'敌方'},
  ];
  const xs = S.map((_,i)=>-294+i*84);
  const inner = S.map((s,i)=>token({x:xs[i],y:0,rr:22,variant:'info',...s.o})
    ).join('') + S.map((s,i)=>label(xs[i],54,s.t)).join('');
  OUT.innerHTML += section('二 · 状态词汇（同一枚令牌的全部状态）', [{
    h3:'一套通道覆盖所有状态', tag:'无需额外图标 · 无需读侧边栏',
    svg:svg('-336 -58 672 124', inner),
    note:'掉血＝熄一段上弧 · 已行动＝压暗加斜杠（不是挪到别处或变灰那么含糊）· 蓄力＝顶部点 · 朝向＝船首尖 · <b>骑兵掉马</b>＝汉字换成「步」但保留 1 段体力，玩家能看懂"它刚刚降级了"。',
  }]);
})();

/* ============ 棋盘几何（与 shared/utils/hexUtils.ts 一致） ============ */
const HS = 31, HR = 2;
const hc = (q,r)=>({ x:HS*(Math.sqrt(3)*q + Math.sqrt(3)/2*r), y:HS*1.5*r });
const hpath = (q,r,k=1)=>{ const c=hc(q,r);
  return Array.from({length:6},(_,i)=>{ const a=Math.PI/180*(60*i+30);
    return `${i?'L':'M'} ${(c.x+HS*k*Math.cos(a)).toFixed(1)},${(c.y+HS*k*Math.sin(a)).toFixed(1)}`;
  }).join(' ')+' Z'; };
const HMAP=[]; for(let q=-HR;q<=HR;q++)
  for(let r=Math.max(-HR,-q-HR);r<=Math.min(HR,-q+HR);r++) HMAP.push({q,r});
/** 去重单遍缝线 */
const HSEAM = (()=>{ const seen=new Set(), out=[];
  for(const {q,r} of HMAP){ const c=hc(q,r);
    const cs=Array.from({length:6},(_,i)=>{const a=Math.PI/180*(60*i+30);
      return [c.x+HS*Math.cos(a), c.y+HS*Math.sin(a)];});
    for(let i=0;i<6;i++){ const a=cs[i], b=cs[(i+1)%6];
      const ka=`${a[0].toFixed(1)} ${a[1].toFixed(1)}`, kb=`${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
      const k=ka<kb?ka+'|'+kb:kb+'|'+ka; if(seen.has(k))continue;
      seen.add(k); out.push(`M ${ka} L ${kb}`);} }
  return out.join(' '); })();
/** 暗色战术盘底：格子只有明度差，信息层才用彩色 */
const boardBase = (extra='')=>
  `<rect x="-400" y="-400" width="800" height="800" fill="#13171D"/>
   ${HMAP.map(h=>`<path d="${hpath(h.q,h.r)}" fill="${C.tile}"/>`).join('')}
   <path d="${HSEAM}" fill="none" stroke="${C.seam}" stroke-width="1"/>${extra}`;
const HVB = `${-HS*4.7} ${-HS*4.35} ${HS*9.4} ${HS*8.7}`;
const tileFill = (q,r,c,op=1)=>`<path d="${hpath(q,r)}" fill="${c}" opacity="${op}"/>`;
const tileRing = (q,r,c,w=2,k=.88)=>`<path d="${hpath(q,r,k)}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
const badge = (q,r,t,c)=>{ const p=hc(q,r);
  return `<text x="${p.x}" y="${p.y+HS*.52}" text-anchor="middle" font-size="10"
    fill="${c}" font-weight="700" letter-spacing=".5">${t}</text>`; };
const tk = (q,r,o)=>{ const p=hc(q,r); return token({x:p.x,y:p.y,rr:HS*.46,variant:'info',...o}); };
const DIR = { E:[1,0], NE:[1,-1], NW:[0,-1], W:[-1,0], SW:[-1,1], SE:[0,1] };
const ray = (q,r,d,n=3)=>Array.from({length:n},(_,i)=>({q:q+DIR[d][0]*(i+1), r:r+DIR[d][1]*(i+1)}));
const onBoard = h=>Math.abs(h.q)<=HR&&Math.abs(h.r)<=HR&&Math.abs(-h.q-h.r)<=HR;
const line = (a,b,c,w,op=1,dash='')=>`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}"
  x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${c}" stroke-width="${w}" opacity="${op}"
  stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`;

/* ============ 区块三：规则暗示层 ============ */
(()=>{
const P = [];

/* --- 1 骑兵冲锋刻度 --- */
P.push({ cls:'rec', h3:'① 骑兵冲锋刻度', tag:'把"移动距离的后果"画进格子',
  note:'规则书写的是「移动 1 无效果 / 移动 2 伤害 +1 / 移动 3 本回合不能攻击」。<i>不要让玩家记。</i>把三环分别标上来——越远越亮代表越猛，第 3 环直接划掉攻击图标。玩家第一次移动骑兵就学会了取舍。',
  svg:(()=>{
    const d1=[{q:0,r:0},{q:1,r:0}], d2=[{q:0,r:-1},{q:1,r:-1}], d3=[{q:0,r:-2},{q:1,r:-2}];
    let s = boardBase();
    s += d1.map(h=>tileFill(h.q,h.r,C.move,.16)+tileRing(h.q,h.r,C.move,1.6)).join('');
    s += d2.map(h=>tileFill(h.q,h.r,C.move,.26)+tileRing(h.q,h.r,C.face,2)).join('');
    s += d3.map(h=>tileFill(h.q,h.r,C.move,.3)+tileRing(h.q,h.r,'rgba(255,255,255,.3)',2)).join('');
    s += badge(0,0,'1',C.move) + badge(0,-1,'2 · 伤+1',C.face)
       + badge(0,-2,'3 · 不可攻',"rgba(255,255,255,.55)");
    s += tileRing(0,1,C.pick,2.4,.94);
    s += tk(0,1,{kind:'qi',ch:'骑',move:3});
    return svg(HVB,s);
  })() });

/* --- 2 步兵方阵 --- */
P.push({ cls:'rec', h3:'② 步兵方阵连结', tag:'最隐蔽的一条规则，可视化后最有价值',
  note:'规则：被弓箭手打时，<b>若该方向背后也有步兵则免伤</b>，改为击退队尾 1 格。这条谁都发现不了。做法：同向相邻的步兵之间画一道<b>脊线</b>，队首亮盾，队尾画出被击退的落点。玩家会主动去"排阵"——一条规则直接变成一种玩法。',
  svg:(()=>{
    const col=[{q:0,r:-1},{q:0,r:0},{q:0,r:1}];
    let s = boardBase();
    // 敌方弓手射界
    s += ray(0,-2,'SE',4).filter(onBoard).map(h=>tileFill(h.q,h.r,C.threat,.13)).join('');
    const a=hc(0,-2), e=hc(0,2);
    s += line(a,e,C.threat,2,.5,'5 4');
    // 方阵脊线
    const c0=hc(0,-1), c2=hc(0,1);
    s += line(c0,c2,C.parch,5,.85);
    s += col.map(h=>{const p=hc(h.q,h.r);
      return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${C.parch}"/>`;}).join('');
    s += tk(0,-2,{kind:'gong',ch:'弓',side:'p2',facing:60});
    s += col.map(h=>tk(h.q,h.r,{kind:'bu',ch:'步'})).join('');
    // 队首盾 + 队尾击退
    const h0=hc(0,-1);
    s += `<g transform="translate(${h0.x},${h0.y-HS*.95}) scale(.85)">
        <path d="M0,-9 L7,-6 L7,2 Q7,8 0,11 Q-7,8 -7,2 L-7,-6 Z" fill="${C.move}"
              stroke="#0E1116" stroke-width="1"/></g>`;
    const t1=hc(0,1), t2=hc(0,2);
    s += line({x:t1.x,y:t1.y+HS*.6},{x:t2.x,y:t2.y-HS*.2},C.face,2.5,.9,'4 3');
    s += `<polygon points="${t2.x},${t2.y} ${t2.x-5},${t2.y-9} ${t2.x+5},${t2.y-9}" fill="${C.face}"/>`;
    s += badge(0,-1,'免伤',C.move) + badge(0,2,'击退',C.face);
    return svg(HVB,s);
  })() });

/* --- 3 弓手射界常显 --- */
P.push({ cls:'rec', h3:'③ 射界常显 + 转向成本', tag:'现在要点「转向」才看得见射界',
  note:'弓手/弩车/投石车都有朝向，<b>转向还要花行动点</b>。现在朝向只是一根箭头，射界必须点按钮才出现。改成：当前射界<i>常驻</i>琥珀色淡光，选中时变亮；其余可选朝向以虚线幽灵显示，各自挂一个成本角标。朝向这套机制就不用讲了。',
  svg:(()=>{
    let s = boardBase();
    ['E','W','SE'].forEach(d=>{ ray(-1,0,d,4).filter(onBoard).forEach(h=>{
        s += tileFill(h.q,h.r,C.face,.05); });
      const a=hc(-1,0), t=ray(-1,0,d,3).slice(-1)[0], b=hc(t.q,t.r);
      s += line(a,b,C.face,1.4,.28,'3 5'); });
    ray(-1,0,'NE',4).filter(onBoard).forEach(h=>{
      s += tileFill(h.q,h.r,C.face,.2)+tileRing(h.q,h.r,C.face,1.4); });
    const a=hc(-1,0), t=ray(-1,0,'NE',3).slice(-1)[0];
    s += line(a,hc(t.q,t.r),C.face,2.4,.85);
    s += badge(1,-2,'射界',C.face) + badge(1,0,'转向 −1',"rgba(240,180,74,.5)");
    s += tileRing(-1,0,C.pick,2.4,.94);
    s += tk(-1,0,{kind:'gong',ch:'弓',facing:-60});
    s += tk(1,-2,{kind:'bu',ch:'步',side:'p2'});
    return svg(HVB,s);
  })() });

/* --- 4 机关占位 --- */
P.push({ h3:'④ 机关占位轮廓', tag:'现在是两个半透明小圆点',
  note:'弩车占 3 格倒 V、战车/投石车各有自己的占位。现在用<b>两个 opacity .3 的小圆点</b>表示，谁也看不出"这是一台占三格的器械"。改成整体底色 + 轮廓，并在转向预览时整块一起转——玩家立刻明白它是一个大家伙，部署时会自己留位置。',
  svg:(()=>{
    const foot=[{q:0,r:-1},{q:-1,r:0},{q:0,r:0}];
    let s = boardBase();
    s += foot.map(h=>tileFill(h.q,h.r,C.p1,.22)).join('');
    s += foot.map(h=>tileRing(h.q,h.r,'rgba(224,86,75,.75)',2,.93)).join('');
    // 转向后的幽灵占位
    const ghost=[{q:0,r:-1},{q:1,r:-1},{q:0,r:-2}];
    s += ghost.map(h=>tileRing(h.q,h.r,'rgba(224,86,75,.28)',1.6,.86)).join('');
    s += badge(-1,0,'占 3 格','rgba(224,86,75,.9)') + badge(1,-1,'转向预览','rgba(224,86,75,.45)');
    s += tk(0,-1,{kind:'gong',ch:'弩',facing:-90});
    return svg(HVB,s);
  })() });

/* --- 5 战车友伤 --- */
P.push({ cls:'rec', h3:'⑤ 战车冲锋 · 友伤预警', tag:'「带友伤」三个字玩家一定会踩',
  note:'战车"如骑兵般移动，前进路上的单位被直接击杀（<b>带友伤</b>）"。文字里一笔带过，实战中必然误伤。做法：选中战车即画出冲锋带，路上每个单位按归属上色——<i>敌军朱红＝战果</i>，<b>己方琥珀闪烁＋警告角</b>。致命操作在点下去之前就看得见。',
  svg:(()=>{
    const lane=[{q:-1,r:1},{q:0,r:1},{q:1,r:1}];
    let s = boardBase();
    s += lane.map(h=>tileFill(h.q,h.r,C.threat,.14)).join('');
    const a=hc(-2,1), b=hc(1,1);
    s += line({x:a.x+HS*.6,y:a.y},{x:b.x,y:b.y},C.threat,3,.55);
    s += tileRing(0,1,C.face,2.6,.94) + tileRing(1,1,C.threat,2.2,.9);
    s += tk(-2,1,{kind:'qi',ch:'车',move:3});
    s += tk(0,1,{kind:'bu',ch:'步'});
    s += tk(1,1,{kind:'bu',ch:'步',side:'p2'});
    const w=hc(0,1);
    s += `<g transform="translate(${w.x+HS*.62},${w.y-HS*.66})">
        <path d="M0,-8 L8,6 L-8,6 Z" fill="${C.face}" stroke="#0E1116" stroke-width="1.2"/>
        <text y="4.5" text-anchor="middle" font-size="9" fill="#0E1116" font-weight="700">!</text></g>`;
    s += badge(0,1,'友伤',C.face) + badge(1,1,'击杀',C.threat);
    return svg(HVB,s);
  })() });

/* --- 6 威胁热区 + 本营危险度 --- */
P.push({ cls:'rec', h3:'⑥ 威胁热区 + 本营危险度', tag:'胜负条件应该一直在画面里',
  note:'胜负是"敌方单位<b>碰到</b>大本营"，但现在大本营只是一个安静的小圆，还会被棋子压住。做法：① 敌方下回合能打到的格子铺<i>斜纹红</i>——站位失误在落子前就能看见；② 大本营画成<b>同心告警环</b>，敌军每靠近一格外环就加一圈并标出剩余步数。玩家永远知道自己离输多远。',
  svg:(()=>{
    const threat=[{q:0,r:-1},{q:1,r:-1},{q:-1,r:0},{q:1,r:0},{q:0,r:1},{q:-1,r:1}];
    let s = `<defs><pattern id="hz" width="7" height="7" patternTransform="rotate(45)"
        patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="${C.threat}" stroke-width="2.2" opacity=".42"/>
      </pattern></defs>` + boardBase();
    s += threat.map(h=>tileFill(h.q,h.r,'url(#hz)')).join('');
    // 大本营：同心告警环
    const b=hc(0,2);
    [1.02,.84,.66].forEach((k,i)=>{ s += tileRing(0,2,`rgba(226,86,75,${.85-i*.22})`,2.2-i*.4,k); });
    s += `<circle cx="${b.x}" cy="${b.y}" r="${HS*.3}" fill="none"
            stroke="${C.threat}" stroke-width="2"/>
          <text x="${b.x}" y="${b.y+1}" text-anchor="middle" dominant-baseline="middle"
            font-size="13" fill="${C.threat}" font-weight="700">營</text>`;
    s += tk(0,0,{kind:'bu',ch:'步',side:'p2'});
    s += badge(0,-1,'敌方可及',"rgba(226,86,75,.75)");
    const t=hc(0,2);
    s += `<text x="${t.x}" y="${t.y+HS*.82}" text-anchor="middle" font-size="10"
            fill="${C.threat}" font-weight="700">剩 2 步</text>`;
    return svg(HVB,s);
  })() });

OUT.innerHTML += section('三 · 规则暗示层：让画面替说明书说话', P);
})();
</script>
</body></html>
